version: "3.9"

services:
  db:
    image: postgres:16
    container_name: gestion_tiempo_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  back:
    build: ./back
    container_name: gestion_tiempo_back
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "4000:4000"
    volumes:
      - ./back:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"

  front:
    build: ./front
    container_name: gestion_tiempo_front
    ports:
      - "3000:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro
    depends_on:
      - back

  pgadmin:
    image: dpage/pgadmin4
    container_name: gestion_tiempo_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  db_data:
