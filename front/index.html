<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tiempo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <link rel="stylesheet" href="/styles/app.css">

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('clientesApp', () => ({
                API: "http://localhost:4000", // Asegúrate que este puerto sea correcto
                clientes: [],
                form: {
                    id: null,
                    titulo: '',
                    nit: '',
                    prefijo: '',
                    correlativo: ''
                },
                errors: {},

                async init() {
                    console.log('Componente Clientes montado');
                    await this.cargarClientes();
                },

                async cargarClientes() {
                    try {
                        const res = await axios.get(`${this.API}/clientes`);
                        this.clientes = res.data;
                    } catch (error) {
                        console.error("Error API:", error);
                    }
                },

                validarTitulo() {
                    const existe = this.clientes.some(c => 
                        c.titulo.toLowerCase() === this.form.titulo.toLowerCase() && 
                        c.id !== this.form.id
                    );
                    this.errors.titulo = existe ? "El cliente ya existe" : "";
                },

                validarNit() {
                    const existe = this.clientes.some(c => 
                        c.nit === this.form.nit && 
                        c.id !== this.form.id
                    );
                    this.errors.nit = existe ? "El NIT ya existe" : "";
                },

                get formValido() {
                    return this.form.titulo && this.form.nit && !this.errors.titulo && !this.errors.nit;
                },

                nuevoCliente() {
                    this.form = { id: null, titulo: '', nit: '', prefijo: '', correlativo: '' };
                    this.errors = {};
                },

                editarCliente(cliente) {
                    this.form = { ...cliente };
                    this.errors = {};
                },

                async guardarCliente() {
                    if (!this.formValido) return;
                    try {
                        const url = this.form.id ? `${this.API}/clientes/${this.form.id}` : `${this.API}/clientes`;
                        const method = this.form.id ? 'put' : 'post';
                        await axios[method](url, this.form);
                        alert("Guardado correctamente");
                        this.nuevoCliente();
                        await this.cargarClientes();
                    } catch (e) {
                        alert("Error: " + (e.response?.data?.error || e.message));
                    }
                },

                async eliminarCliente(id) {
                    if(!confirm("¿Eliminar?")) return;
                    try {
                        await axios.delete(`${this.API}/clientes/${id}`);
                        await this.cargarClientes();
                    } catch (e) {
                        alert("Error al eliminar");
                    }
                }
            }))
        })
    </script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-screen flex overflow-hidden bg-gray-100">
    
    <div id="sidebar-container" class="w-64 bg-white hidden md:block border-r">
        <div class="p-4 font-bold text-blue-900">Menú</div>
        <nav class="p-2">
            <a href="#cliente" class="block p-2 hover:bg-blue-50 text-blue-800">Clientes</a>
        </nav>
    </div>

    <div class="flex-1 flex flex-col">
        <div class="bg-white shadow p-4">
            <h1 class="font-bold">Sistema de Gestión</h1>
        </div>
        
        <main id="view-container" class="flex-1 overflow-y-auto p-6"></main>
    </div>

    <script src="/router.js"></script>
</body>
</html>
