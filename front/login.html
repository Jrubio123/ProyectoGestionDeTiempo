<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Silver Consulting</title>
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/env.js"></script>
    <script defer src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script defer src="/js/login.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }

        /* AnimaciÃ³n de fondo suave */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden flex items-center justify-center h-screen relative">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
    </div>

    <div x-data="authApp()" x-init="init()" class="relative z-10 w-full max-w-4xl h-[600px] bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 flex overflow-hidden">
        
        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center relative transition-all duration-500">
            
            <div class="absolute top-8 left-8 flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center text-white font-bold">S</div>
                <span class="font-bold text-gray-800 text-lg">Silver Consulting</span>
            </div>

            <div class="mb-8 mt-10">
                <h2 class="text-3xl font-extrabold text-gray-900">Acceso Corporativo</h2>
                <p class="text-gray-500 text-sm mt-2">Inicia sesiÃ³n con tu cuenta Microsoft.</p>
            </div>

            <div class="space-y-4">
                <button @click="loginMicrosoft" :disabled="loading" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-bold shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-95 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
                    <svg x-show="loading" class="animate-spin -ml-1 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span x-text="loading ? 'Procesando...' : 'Ingresar con Microsoft'"></span>
                </button>

                <div x-show="error" x-transition class="text-red-500 text-xs font-semibold flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span x-text="error"></span>
                </div>
            </div>
        </div>

        <div class="hidden md:block md:w-1/2 bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');">
            <div class="absolute inset-0 bg-gradient-to-br from-blue-600/80 to-purple-800/80 backdrop-blur-[2px] flex flex-col items-center justify-center text-white p-12 text-center">
                <h3 class="text-4xl font-bold mb-4 tracking-tight">GestiÃ³n Inteligente</h3>
                <p class="text-white/90 text-lg">Optimiza tiempos, coordina equipos y controla costos con Silver Consulting.</p>
                
                <div class="absolute top-10 right-10 w-20 h-20 bg-white/10 rounded-2xl backdrop-blur-md border border-white/20 animate-bounce" style="animation-duration: 3s;"></div>
                <div class="absolute bottom-20 left-10 w-16 h-16 bg-white/10 rounded-full backdrop-blur-md border border-white/20 animate-bounce" style="animation-duration: 4s;"></div>
            </div>
        </div>

    </div>

</body>
</html>
