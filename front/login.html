<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Silver Consulting</title>
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/env.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script defer src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script defer src="/js/login.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="overflow-hidden flex items-center justify-center h-screen relative">

    <div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('/assets/images/FONDO1.png');"></div>
    <div class="absolute inset-0 z-0 bg-slate-900/45"></div>

    <div class="absolute top-10 right-10 w-20 h-20 bg-white/10 rounded-2xl backdrop-blur-md border border-white/20 animate-bounce z-0" style="animation-duration: 3s;"></div>
    <div class="absolute bottom-20 left-10 w-16 h-16 bg-white/10 rounded-full backdrop-blur-md border border-white/20 animate-bounce z-0" style="animation-duration: 4s;"></div>
    <div class="absolute top-1/4 left-1/4 w-24 h-24 bg-white/10 rounded-3xl backdrop-blur-md border border-white/20 animate-pulse z-0"></div>
    <div class="absolute bottom-1/4 right-1/4 w-14 h-14 bg-white/10 rounded-xl backdrop-blur-md border border-white/20 animate-pulse z-0"></div>

    <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_20%_20%,rgba(255,255,255,0.16),transparent_32%),radial-gradient(circle_at_80%_80%,rgba(255,255,255,0.10),transparent_28%)]"></div>

    <div x-data="authApp()" x-init="init()" class="relative z-10 w-full max-w-4xl h-[600px] bg-white/22 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/35 flex overflow-hidden">

        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center relative transition-all duration-500 bg-white/22 backdrop-blur-md">
            
            <div class="absolute top-8 left-8 flex items-center gap-2">
                <img src="/assets/images/LogoPequeño.png" alt="Logo Silver Consulting" class="w-8 h-8 rounded-lg object-cover border border-white/30" />
                <span class="font-bold text-white text-lg drop-shadow-sm">Silver Consulting</span>
            </div>

            <div class="mb-8 mt-10">
                <h2 class="text-3xl font-extrabold text-white drop-shadow-sm">Acceso Corporativo</h2>
                <p class="text-white/80 text-sm mt-2" x-text="isLocalMode ? 'Modo local: puedes usar correo/contraseña o Microsoft.' : 'Inicia sesión con tu cuenta Microsoft.'"></p>
            </div>

            <div class="space-y-4">
                <form x-show="isLocalMode" @submit.prevent="loginLocal" class="space-y-3 bg-white/20 rounded-xl border border-white/35 p-4 backdrop-blur-md">
                    <input x-model="email" type="email" placeholder="Correo" class="w-full px-3 py-2 rounded-lg border border-white/40 bg-white/70 text-slate-900 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500" />
                    <input x-model="password" type="password" placeholder="Contraseña" class="w-full px-3 py-2 rounded-lg border border-white/40 bg-white/70 text-slate-900 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500" />
                    <button type="submit" :disabled="loading" class="w-full py-2.5 bg-slate-900/85 text-white rounded-lg font-semibold hover:bg-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <span x-text="loading ? 'Ingresando...' : 'Ingresar (Local)'"></span>
                    </button>
                </form>

                <div x-show="isLocalMode && savedUsers.length" class="space-y-2">
                    <p class="text-xs font-semibold text-white/80">Usuarios recientes</p>
                    <template x-for="u in savedUsers" :key="u">
                        <div class="flex items-center gap-2">
                            <button @click="usarUsuarioGuardado(u)" type="button" class="flex-1 text-left text-xs px-3 py-2 rounded-lg border border-white/35 bg-white/25 text-white hover:bg-white/35" x-text="u"></button>
                            <button @click="eliminarUsuarioGuardado(u)" type="button" class="text-xs px-2 py-2 rounded-lg border border-white/35 bg-white/20 text-white hover:bg-red-500/35 hover:border-red-300/50">Quitar</button>
                        </div>
                    </template>
                </div>

                <div x-show="isLocalMode" class="flex items-center gap-3 text-xs text-white/70">
                    <div class="h-px bg-white/30 flex-1"></div>
                    <span>o</span>
                    <div class="h-px bg-white/30 flex-1"></div>
                </div>

                <button @click="loginMicrosoft" :disabled="loading" class="w-full py-3 bg-white/20 border border-white/35 text-white rounded-xl font-bold shadow-lg shadow-black/20 hover:bg-white/28 hover:scale-[1.02] active:scale-95 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 backdrop-blur-md">
                    <svg x-show="loading" class="animate-spin -ml-1 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span x-text="loading ? 'Procesando...' : 'Ingresar con Microsoft'"></span>
                </button>

                <div x-show="error" x-transition class="text-red-500 text-xs font-semibold flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span x-text="error"></span>
                </div>
            </div>
        </div>

        <div class="hidden md:block md:w-1/2 bg-cover bg-center relative" style="background-image: url('/assets/images/FONDO1.png');">
            <div class="absolute inset-0 bg-gradient-to-br from-slate-900/45 to-slate-900/62 backdrop-blur-[2px] flex flex-col items-center justify-center text-white p-12 text-center">
                <h3 class="text-4xl font-bold mb-4 tracking-tight">Gestión Inteligente</h3>
                <p class="text-white/90 text-lg">Optimiza tiempos, coordina equipos y controla costos con Silver Consulting.</p>
                
                <div class="absolute top-10 right-10 w-20 h-20 bg-white/10 rounded-2xl backdrop-blur-md border border-white/20 animate-bounce" style="animation-duration: 3s;"></div>
                <div class="absolute bottom-20 left-10 w-16 h-16 bg-white/10 rounded-full backdrop-blur-md border border-white/20 animate-bounce" style="animation-duration: 4s;"></div>
            </div>
        </div>

    </div>

</body>
</html>
