<div x-data="asignacionCoordApp" class="max-w-7xl mx-auto space-y-6 animate-fade-in-up">

    <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-sm border border-blue-50 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">
                Asignación de Coordinadores
            </h1>
            <p class="text-gray-500 text-sm mt-1">Vincula los coordinadores responsables a cada cliente.</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <div class="lg:col-span-4">
            <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 sticky top-6">
                
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-1.5 h-6 bg-cyan-500 rounded-full"></span>
                        <span x-text="form.id ? 'Editar Asignación' : 'Nueva Asignación'"></span>
                    </h2>
                    <button @click="limpiarFormulario" class="text-xs text-gray-400 hover:text-blue-600 transition-colors">Limpiar</button>
                </div>

                <form @submit.prevent="guardar" class="space-y-5">

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Cliente <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <select x-model="form.cliente_id" @change="validarDuplicado" class="w-full pl-3 pr-8 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all appearance-none">
                                <option value="">Seleccione Cliente...</option>
                                <template x-for="c in cat.clientes" :key="c.id">
                                    <option :value="c.id" x-text="c.titulo"></option>
                                </template>
                            </select>
                            <div class="absolute right-3 top-3.5 pointer-events-none text-gray-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Coordinador Responsable <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <select x-model="form.coordinador_id" @change="validarDuplicado" class="w-full pl-3 pr-8 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all appearance-none">
                                <option value="">Seleccione Coordinador...</option>
                                <template x-for="u in cat.coordinadores" :key="u.id">
                                    <option :value="u.id" x-text="u.nombre_usuario"></option>
                                </template>
                            </select>
                            <div class="absolute right-3 top-3.5 pointer-events-none text-gray-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                        </div>
                    </div>

                    <div x-show="errors.duplicado" x-transition class="bg-red-50 text-red-600 p-3 rounded-lg text-xs font-bold flex items-start gap-2 border border-red-100">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>Este Coordinador ya está asignado a este Cliente.</span>
                    </div>

                    <div class="pt-4 flex gap-3">
                        <button type="button" @click="limpiarFormulario" class="flex-1 px-4 py-3 bg-white text-gray-700 border border-gray-200 rounded-xl hover:bg-gray-50 font-medium text-sm transition-colors">Cancelar</button>
                        
                        <button type="submit" 
                            :disabled="!formValido || errors.duplicado"
                            class="flex-[2] py-3 text-white transition-all duration-300 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-xl font-bold shadow-lg hover:shadow-blue-500/30 hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex justify-center items-center gap-2">
                            <span x-show="!form.id">Asignar</span>
                            <span x-show="form.id">Actualizar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="bg-white rounded-2xl shadow-lg border border-gray-100 flex flex-col h-full min-h-[500px]">
                
                <div class="p-5 border-b border-gray-100 bg-gray-50/50 flex flex-col md:flex-row gap-4 items-end">
                    <div class="flex-1 w-full">
                        <label class="text-xs font-bold text-gray-400 uppercase">Filtrar por Cliente</label>
                        <select x-model="filters.cliente" class="w-full mt-1 p-2 border border-gray-200 rounded-lg text-sm bg-white focus:border-blue-500 outline-none">
                            <option value="">Todos</option>
                            <template x-for="c in cat.clientes" :key="c.id">
                                <option :value="c.titulo" x-text="c.titulo"></option>
                            </template>
                        </select>
                    </div>
                    <div class="flex-1 w-full">
                        <label class="text-xs font-bold text-gray-400 uppercase">Filtrar por Coordinador</label>
                        <select x-model="filters.coordinador" class="w-full mt-1 p-2 border border-gray-200 rounded-lg text-sm bg-white focus:border-blue-500 outline-none">
                            <option value="">Todos</option>
                            <template x-for="u in cat.coordinadores" :key="u.id">
                                <option :value="u.nombre_usuario" x-text="u.nombre_usuario"></option>
                            </template>
                        </select>
                    </div>
                    <button @click="cargarDatos" class="p-2.5 bg-white border border-gray-200 rounded-lg text-gray-500 hover:text-blue-600 hover:border-blue-300 transition-colors" title="Recargar">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>

                <div class="flex-1 overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-xs font-bold text-gray-400 uppercase bg-white border-b border-gray-100">
                                <th class="px-6 py-4">Cliente</th>
                                <th class="px-6 py-4">Coordinador Responsable</th>
                                <th class="px-6 py-4 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50">
                            <template x-for="item in filtrados" :key="item.id">
                                <tr class="hover:bg-blue-50/50 transition-colors group" :class="{'bg-blue-50': form.id === item.id}">
                                    
                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
                                                <span x-text="item.nombre_cliente.charAt(0)"></span>
                                            </div>
                                            <span class="font-bold text-gray-700" x-text="item.nombre_cliente"></span>
                                        </div>
                                    </td>

                                    <td class="px-6 py-4">
                                        <div class="flex items-center gap-2">
                                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                            <span class="text-gray-600 text-sm" x-text="item.nombre_coordinador"></span>
                                        </div>
                                    </td>

                                    <td class="px-6 py-4 text-center">
                                        <div class="flex justify-center gap-2 opacity-60 group-hover:opacity-100 transition-opacity">
                                            <button @click="editar(item)" class="p-1.5 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                            <button @click="eliminar(item.id)" class="p-1.5 text-red-600 hover:bg-red-100 rounded-lg transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('asignacionCoordApp', () => ({
            API: "http://localhost:4000",
            
            cat: {
                clientes: [],
                coordinadores: []
            },
            
            asignaciones: [],
            
            form: {
                id: null,
                cliente_id: '',
                coordinador_id: ''
            },
            
            filters: { cliente: '', coordinador: '' },
            errors: { duplicado: false },

            async init() {
                await Promise.all([
                    this.cargarCatalogos(),
                    this.cargarDatos()
                ]);
            },

            async cargarCatalogos() {
                try {
                    // Cargamos clientes y usuarios (roles)
                    // Nota: Si no tienes endpoint de roles, usa el de usuarios y filtra en JS por ahora
                    const [resCli, resUsers] = await Promise.all([
                        axios.get(`${this.API}/clientes`),
                        axios.get(`${this.API}/usuarios`) // Asumiendo que tienes este endpoint
                    ]);
                    
                    this.cat.clientes = resCli.data;
                    // Filtramos solo coordinadores (ajusta la lógica según tu BD)
                    // Si no tienes roles, usa todos los usuarios por ahora
                    this.cat.coordinadores = resUsers.data; //.filter(u => u.rol === 'Coordinador');
                    
                } catch(e) { 
                    console.error("Error cargando catálogos", e); 
                    // Mockup para que veas el diseño
                    this.cat.clientes = [{id: 1, titulo: 'Cliente A'}, {id: 2, titulo: 'Cliente B'}];
                    this.cat.coordinadores = [{id: 10, nombre_usuario: 'Juan Coord'}, {id: 20, nombre_usuario: 'Ana Coord'}];
                }
            },

            async cargarDatos() {
                try {
                    const res = await axios.get(`${this.API}/asignaciones-coordinador`);
                    this.asignaciones = res.data;
                } catch(e) {
                    this.asignaciones = [];
                }
            },

            validarDuplicado() {
                if(!this.form.cliente_id || !this.form.coordinador_id) {
                    this.errors.duplicado = false;
                    return;
                }

                const existe = this.asignaciones.some(a => 
                    a.cliente_id == this.form.cliente_id &&
                    a.coordinador_id == this.form.coordinador_id &&
                    a.id !== this.form.id
                );
                this.errors.duplicado = existe;
            },

            get formValido() {
                return this.form.cliente_id && this.form.coordinador_id;
            },

            get filtrados() {
                return this.asignaciones.filter(a => {
                    const matchCli = this.filters.cliente ? a.nombre_cliente === this.filters.cliente : true;
                    const matchCoord = this.filters.coordinador ? a.nombre_coordinador === this.filters.coordinador : true;
                    return matchCli && matchCoord;
                });
            },

            limpiarFormulario() {
                this.form = { id: null, cliente_id: '', coordinador_id: '' };
                this.errors.duplicado = false;
            },

            editar(item) {
                this.form = { 
                    id: item.id,
                    cliente_id: item.cliente_id,
                    coordinador_id: item.coordinador_id
                };
                this.errors.duplicado = false;
            },

            async guardar() {
                try {
                    const method = this.form.id ? 'put' : 'post';
                    const url = this.form.id ? `${this.API}/asignaciones-coordinador/${this.form.id}` : `${this.API}/asignaciones-coordinador`;
                    
                    await axios[method](url, this.form);
                    
                    alert("Guardado correctamente");
                    this.limpiarFormulario();
                    await this.cargarDatos();
                } catch(e) {
                    alert("Error: " + (e.response?.data?.error || "Error al guardar"));
                }
            },

            async eliminar(id) {
                if(!confirm("¿Eliminar asignación?")) return;
                try {
                    await axios.delete(`${this.API}/asignaciones-coordinador/${id}`);
                    await this.cargarDatos();
                } catch(e) {
                    alert("Error al eliminar");
                }
            }
        }))
    })
</script>
