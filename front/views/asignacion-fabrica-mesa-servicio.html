<div x-data="mesaFabricaApp()" x-init="init()" class="max-w-7xl mx-auto space-y-6 animate-fade-in-up">

    <div class="bg-white/80 backdrop-blur-md p-4 md:p-6 rounded-2xl shadow-sm border border-purple-50 flex flex-col md:flex-row justify-between md:items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500">
                Mesa de Servicio & Fábrica
            </h1>
            <p class="text-gray-500 text-sm mt-1">Gestiona tus tickets e incidentes asignados.</p>
        </div>
        <div class="flex items-center gap-2">
            <button @click="abrirSolicitudes()" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-sm font-bold hover:bg-purple-700 transition-colors">
                Solicitudes
            </button>
            <button @click="init()" class="p-2 bg-white border border-gray-200 rounded-full hover:rotate-180 transition-transform duration-500 text-purple-600 shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <template x-for="item in assignmentCards" :key="item.id">
            <div class="bg-white rounded-2xl shadow-md border border-gray-100 hover:shadow-xl transition-shadow duration-300 flex flex-col overflow-hidden relative group">
                
                <div class="h-1 w-full" :class="{
                    'bg-green-500': item.estado === 'Abierto',
                    'bg-yellow-500': item.estado === 'Proceso',
                    'bg-gray-400': item.estado === 'Cerrado'
                }"></div>

                <div class="p-5 flex-1 flex flex-col gap-3">
                    
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400" x-text="item.tipo_asignacion"></span>
                            <h3 class="font-bold text-gray-800 text-lg leading-tight" x-text="item.nombre_cliente"></h3>
                            <p class="text-xs text-purple-600 font-medium" x-text="item.nombre_modulo"></p>
                        </div>
                        <button
                            @click="crearSolicitud(item)"
                            :disabled="!canCreateSolicitud(item)"
                            title="Crear nueva solicitud desde esta asignación"
                            class="p-1.5 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:text-gray-400 disabled:hover:bg-transparent"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    </div>

                    <div class="bg-gray-50 rounded-xl p-3 space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500 text-xs">Código Ticket:</span>
                            <span class="font-mono font-bold text-gray-700" x-text="codigoTicket(item)"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500 text-xs">Caso Cliente:</span>
                            <span class="font-mono font-bold text-gray-700" x-text="item.nro_caso_cliente || '---'"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500 text-xs">Caso Interno:</span>
                            <span class="font-mono font-bold text-gray-700" x-text="item.nro_caso_interno || '---'"></span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center text-xs text-gray-400 mt-2">
                        <div class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <span x-text="formatDate(item.fecha_inicio)"></span>
                        </div>
                        <span class="px-2 py-1 rounded-full bg-gray-100 text-gray-600 font-bold" x-text="item.estado"></span>
                    </div>

                </div>

                <div class="bg-gray-50 p-3 border-t border-gray-100 flex justify-between items-center">
                    <div class="text-xs text-gray-500">
                        Coord: <span class="font-bold" x-text="item.nombre_coordinador"></span>
                        <span class="ml-2 px-2 py-0.5 rounded-full bg-white border text-[10px] font-bold" x-text="estadoAprobacionLabel(item)"></span>
                    </div>
                    <button @click="abrirSolicitudes()" class="text-xs font-bold text-purple-600 hover:text-purple-800">
                        Gestionar
                    </button>
                </div>

            </div>
        </template>

    </div>

    <div x-show="solicitudesOpen" x-transition.opacity class="view-overlay bg-white/30 backdrop-blur-md" style="display: none;">
        <div class="w-11/12 max-w-3xl bg-white/80 backdrop-blur-lg rounded-3xl border border-white/60 shadow-2xl p-6 overflow-y-auto max-h-[85vh]">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-6 sticky top-0 bg-white z-10 pb-4 border-b border-gray-100">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Solicitudes</h3>
                    <p class="text-sm text-gray-500">Pool de tickets por enviar y tickets enviados a coordinación.</p>
                </div>
                <button @click="solicitudesOpen = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="border rounded-xl p-4">
                    <h4 class="font-bold text-gray-800 mb-3">Por enviar / Devueltas</h4>
                    <div class="space-y-3" x-show="solicitudesPorEnviar.length">
                        <template x-for="item in solicitudesPorEnviar" :key="`send-${item.reporte_id}`">
                            <div class="border rounded-lg p-3">
                                <div class="flex justify-between items-start gap-3">
                                    <div>
                                        <p class="font-semibold text-gray-800" x-text="`${item.nombre_cliente} - ${item.nombre_modulo || 'Sin módulo'}`"></p>
                                        <p class="text-xs text-gray-500" x-text="`Caso: ${ticketCasoTexto(item)}`"></p>
                                        <p class="text-xs text-gray-500" x-text="`Código: ${codigoTicket(item)}`"></p>
                                        <p class="text-xs text-gray-500" x-text="`Coord: ${item.nombre_coordinador || 'N/A'}`"></p>
                                    </div>
                                    <span class="px-2 py-1 rounded-full border text-xs font-bold" :class="estadoBadgeClass(item)" x-text="estadoAprobacionLabel(item)"></span>
                                </div>
                                <div class="mt-3 flex flex-col sm:flex-row sm:justify-end gap-2">
                                    <button @click="editarTicket(item)" :disabled="!canEdit(item)" class="px-3 py-1.5 rounded-lg text-xs font-bold border border-gray-300 text-gray-700 disabled:opacity-40">Editar</button>
                                    <button @click="enviarTicket(item)" :disabled="!canSend(item)" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white disabled:opacity-40">Enviar Ticket</button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <p x-show="!solicitudesPorEnviar.length" class="text-sm text-gray-400">No hay tickets por enviar.</p>
                </div>

                <div class="border rounded-xl p-4">
                    <h4 class="font-bold text-gray-800 mb-3">Enviadas (Pendiente coordinación)</h4>
                    <div class="space-y-3" x-show="solicitudesEnviadas.length">
                        <template x-for="item in solicitudesEnviadas" :key="`pend-${item.reporte_id}`">
                            <div class="border rounded-lg p-3">
                                <div class="flex justify-between items-start gap-3">
                                    <div>
                                        <p class="font-semibold text-gray-800" x-text="`${item.nombre_cliente} - ${item.nombre_modulo || 'Sin módulo'}`"></p>
                                        <p class="text-xs text-gray-500" x-text="`Caso: ${ticketCasoTexto(item)}`"></p>
                                        <p class="text-xs text-gray-500" x-text="`Código: ${codigoTicket(item)}`"></p>
                                        <p class="text-xs text-gray-500" x-text="`Coord: ${item.nombre_coordinador || 'N/A'}`"></p>
                                    </div>
                                    <span class="px-2 py-1 rounded-full border text-xs font-bold" :class="estadoBadgeClass(item)" x-text="estadoAprobacionLabel(item)"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                    <p x-show="!solicitudesEnviadas.length" class="text-sm text-gray-400">No hay tickets pendientes en coordinación.</p>
                </div>
            </div>
        </div>
    </div>

    <div x-show="modalOpen" x-transition.opacity class="view-overlay bg-white/30 backdrop-blur-md" style="display: none;">
        <div class="w-11/12 max-w-3xl bg-white/80 backdrop-blur-lg rounded-3xl border border-white/60 shadow-2xl p-6 overflow-y-auto max-h-[85vh]">

            <div class="flex justify-between items-center mb-6 sticky top-0 bg-white z-10 pb-4 border-b border-gray-100">
                <h3 class="text-xl font-bold text-gray-800">Gestionar Ticket</h3>
                <button @click="modalOpen = false" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <form @submit.prevent="guardarCambios" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Tipo Asignación</label>
                        <div class="w-full mt-1 p-2 rounded-lg text-sm border bg-gray-50 text-gray-700" x-text="form.tipo_asignacion || '---'"></div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Módulo</label>
                        <div class="w-full mt-1 p-2 rounded-lg text-sm border bg-gray-50 text-gray-700" x-text="form.nombre_modulo || '---'"></div>
                    </div>
                </div>

                <template x-if="isMesa()">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Nro Caso Interno</label>
                            <input type="text" x-model="form.nro_caso_interno" class="w-full mt-1 p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Nro Caso Cliente</label>
                            <input type="text" x-model="form.nro_caso_cliente" class="w-full mt-1 p-2 border rounded-lg text-sm">
                        </div>
                    </div>
                </template>

                <template x-if="isFabrica()">
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">WRICEF</label>
                            <input type="text" x-model="form.wricef" class="w-full mt-1 p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Nombre Requerimiento</label>
                            <input type="text" x-model="form.requerimiento" class="w-full mt-1 p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Perfil</label>
                            <div class="w-full mt-1 p-2 rounded-lg text-sm border bg-gray-50 text-gray-700" x-text="getPerfilFabricaAsignado(form) || 'Sin perfil asignado'"></div>
                            <input type="hidden" x-model="form.perfil_fabrica">
                        </div>
                    </div>
                </template>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div x-show="isMesa()">
                        <label class="text-xs font-bold text-gray-500 uppercase">Tipo Servicio</label>
                        <select x-model="form.tipo_servicio" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white">
                            <option value="">Seleccione...</option>
                            <option value="Servicio">Servicio</option>
                            <option value="Incidente">Incidente</option>
                            <option value="Requerimiento">Requerimiento</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Estado</label>
                        <select x-model="form.estado_ticket" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white">
                            <option value="">Seleccione...</option>
                            <template x-for="opt in estadoOptions()" :key="opt">
                                <option :value="opt" x-text="opt"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Fecha Ingreso</label>
                        <input type="date" x-model="form.fecha_inicio" class="w-full mt-1 p-2 border rounded-lg text-sm">
                    </div>
                    <div x-show="shouldShowFechaCierre()">
                        <label class="text-xs font-bold text-gray-500 uppercase">Fecha Cierre</label>
                        <input type="date" x-model="form.fecha_cierre" class="w-full mt-1 p-2 border rounded-lg text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Horas</label>
                        <input type="number" min="0" step="0.01" x-model.number="form.horas_reportadas" @input="recalcularTotalForm()" class="w-full mt-1 p-2 border rounded-lg text-sm">
                    </div>
                    <div x-show="!esAsociado">
                        <label class="text-xs font-bold text-gray-500 uppercase">Total a Cobrar</label>
                        <div class="w-full mt-1 p-2 rounded-lg text-sm font-bold text-right border bg-gray-50 text-gray-700" x-text="formatMoney(form.total_cobrar)"></div>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Observaciones</label>
                    <textarea x-model="form.observacion" rows="3" class="w-full mt-1 p-2 border rounded-lg text-sm resize-none"></textarea>
                </div>

                <div class="pt-4 flex flex-col-reverse sm:flex-row justify-end gap-3">
                    <button type="button" @click="modalOpen = false" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-bold shadow-lg shadow-purple-500/30">Guardar Cambios</button>
                </div>
            </form>

        </div>
    </div>

</div>
