<div x-data="subConsultoresApp()" class="max-w-7xl mx-auto space-y-6 animate-fade-in-up">

    <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-sm border border-orange-50 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-red-500">
                Gestión de Equipo
            </h1>
            <p class="text-gray-500 text-sm mt-1">Administra tus consultores asociados y su información de pago.</p>
        </div>
        <button @click="abrirModal()" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg shadow-orange-500/30 transition-all hover:-translate-y-0.5 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Asociar Consultor
        </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide">Consultores</h2>
                <span class="text-xs text-gray-400" x-text="principales.length"></span>
            </div>
            <div class="space-y-2 max-h-[520px] overflow-y-auto pr-1">
                <template x-for="p in principales" :key="p.id">
                    <button @click="seleccionarPrincipal(p)" class="w-full text-left px-4 py-3 rounded-xl border transition-all"
                        :class="principalSeleccionado && principalSeleccionado.id === p.id ? 'border-orange-300 bg-orange-50 text-orange-700' : 'border-gray-100 hover:border-orange-200 hover:bg-orange-50/40'">
                        <div class="font-semibold text-sm truncate" x-text="p.nombre_usuario"></div>
                        <div class="text-xs text-gray-500 truncate" x-text="p.email"></div>
                    </button>
                </template>
                <div x-show="principales.length === 0" class="text-sm text-gray-400 text-center py-8">
                    No hay consultores disponibles.
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide">Asociados</h2>
                    <p class="text-xs text-gray-500" x-show="principalSeleccionado">
                        Principal: <span class="font-semibold" x-text="principalSeleccionado?.nombre_usuario"></span>
                    </p>
                </div>
                <span class="text-xs text-gray-400" x-text="asociados.length"></span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="c in asociados" :key="c.id">
                    <div class="border border-gray-100 rounded-xl p-4 flex items-center justify-between">
                        <div class="min-w-0">
                            <div class="font-semibold text-sm truncate" x-text="c.nombre_usuario"></div>
                            <div class="text-xs text-gray-500 truncate" x-text="c.email"></div>
                        </div>
                        <button @click="eliminar(c)" class="text-xs text-red-400 hover:text-red-600 hover:underline">Desvincular</button>
                    </div>
                </template>

                <div x-show="asociados.length === 0" class="col-span-full py-10 flex flex-col items-center justify-center text-gray-400 border-2 border-dashed border-gray-200 rounded-2xl">
                    <svg class="w-14 h-14 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <p>No hay asociados para este consultor.</p>
                </div>
            </div>
        </div>
    </div>

    <div x-show="modal.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm" style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl p-8 transform transition-all scale-100">
            <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                <h3 class="text-2xl font-bold text-gray-800">Asociar consultor</h3>
                <button @click="modal.open = false" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Consultor disponible</label>
                    <select x-model="seleccionadoId" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-sm focus:border-orange-500 outline-none">
                        <option value="">Seleccione...</option>
                        <template x-for="c in disponibles" :key="c.id">
                            <option :value="c.id" x-text="`${c.nombre_usuario} - ${c.email}`"></option>
                        </template>
                    </select>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" @click="modal.open = false" class="px-6 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">Cancelar</button>
                    <button type="button" @click="asociar" class="px-8 py-3 bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold rounded-xl shadow-lg hover:shadow-orange-500/30 transition-transform hover:-translate-y-0.5">Asociar</button>
                </div>
            </div>
        </div>
    </div>

</div>
