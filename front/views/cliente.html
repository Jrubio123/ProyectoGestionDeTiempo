<div x-data="clientesApp"> <div class="bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-6 text-blue-900">Gestión de Clientes</h1>

    <form @submit.prevent="guardarCliente" class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-sm font-semibold mb-2">Nombre cliente</label>
        <input class="border p-2 w-full" x-model="form.titulo" @input="validarTitulo()">
        <p class="text-red-600 text-sm" x-text="errors.titulo"></p>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2">NIT</label>
        <input class="border p-2 w-full" x-model="form.nit" @input="validarNit()">
        <p class="text-red-600 text-sm" x-text="errors.nit"></p>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2">Prefijo</label>
        <input class="border p-2 w-full" x-model="form.prefijo">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2">Correlativo</label>
        <input class="border p-2 w-full bg-gray-100" :value="form.correlativo" disabled>
      </div>

      <div class="col-span-2 flex gap-3 mt-3">
        <button class="bg-blue-900 text-white px-4 py-2 rounded disabled:opacity-50" :disabled="!formValido">
          <span x-text="form.id ? 'Actualizar' : 'Guardar'"></span>
        </button>
        <button type="button" class="bg-gray-600 text-white px-4 py-2 rounded" @click="nuevoCliente">
          Nuevo
        </button>
      </div>
    </form>

    <div class="border-t pt-4">
      <div class="grid grid-cols-4 font-bold mb-2 bg-gray-50 p-2">
        <div>Cliente</div>
        <div>NIT</div>
        <div>Código</div>
        <div>Acciones</div>
      </div>
      <template x-for="cliente in clientes" :key="cliente.id">
        <div class="grid grid-cols-4 py-2 border-b hover:bg-gray-50">
            <div x-text="cliente.titulo"></div>
            <div x-text="cliente.nit"></div>
            <div x-text="`${cliente.prefijo || ''}${cliente.correlativo || ''}`"></div>
            <div class="flex gap-2">
                <button class="text-blue-700" @click="editarCliente(cliente)">✏️</button>
                <button class="text-red-600" @click="eliminarCliente(cliente.id)">🗑</button>
            </div>
        </div>
      </template>
    </div>
  </div>
</div>
