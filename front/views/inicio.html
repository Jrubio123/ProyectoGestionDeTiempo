<div class="relative flex min-h-[500px] flex-col items-center justify-center space-y-6 overflow-hidden p-6 text-center">
    <div x-data="{ text: 'Silver Consulting', displayed: '', init() { let i = 0; const type = () => { if (i < this.text.length) { this.displayed += this.text.charAt(i++); setTimeout(type, 100); } }; setTimeout(type, 500); } }">
        <h1 class="mb-4 text-5xl font-extrabold tracking-tight md:text-7xl"><span class="bg-gradient-to-r from-[#667eea] to-[#764ba2] bg-clip-text text-transparent" x-text="displayed"></span><span class="animate-pulse text-gray-400">|</span></h1>
        <p class="text-xl font-medium text-gray-500">Bienvenido al sistema de gestión.</p>
    </div>
</div>
