<div x-data="misCuentasApp()" class="max-w-7xl mx-auto space-y-6 animate-fade-in-up">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-sm border border-cyan-50">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-blue-600">
                Historial de Cobros
            </h1>
            <p class="text-gray-500 text-sm mt-1">Consulta el estado de tus cuentas de cobro generadas.</p>
        </div>

        <div class="bg-gradient-to-br from-cyan-500 to-blue-600 p-6 rounded-2xl shadow-lg text-white flex flex-col justify-center">
            <p class="text-xs font-bold uppercase opacity-80">Total Cobrado (Año)</p>
            <p class="text-3xl font-mono font-bold" x-text="formatearDinero(totalAnual)"></p>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden min-h-[600px] flex flex-col">
        
        <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex flex-wrap gap-4 items-end">
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase">Desde</label>
                <input type="date" x-model="filtros.inicio" class="block w-40 p-2 border rounded-lg text-sm">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase">Hasta</label>
                <input type="date" x-model="filtros.fin" class="block w-40 p-2 border rounded-lg text-sm">
            </div>
            <button @click="cargarHistorial" class="px-4 py-2 bg-cyan-600 text-white rounded-lg font-bold shadow hover:bg-cyan-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Filtrar
            </button>
            <button @click="limpiarFiltros" class="px-4 py-2 text-gray-500 hover:text-gray-700 font-medium">Limpiar</button>
        </div>

        <div class="flex-1 overflow-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 sticky top-0 z-10 text-xs font-bold text-gray-400 uppercase">
                    <tr>
                        <th class="px-6 py-4">ID / Fecha Gen.</th>
                        <th class="px-6 py-4">Periodo Cobrado</th>
                        <th class="px-6 py-4 text-center">Estado</th>
                        <th class="px-6 py-4 text-right">Total</th>
                        <th class="px-6 py-4 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50 text-sm">
                    <template x-for="c in cuentas" :key="c.id">
                        <tr class="hover:bg-cyan-50/20 transition-colors">
                            <td class="px-6 py-4">
                                <span class="font-bold text-gray-800">#<span x-text="c.id"></span></span>
                                <p class="text-xs text-gray-400" x-text="formatDate(c.created_at)"></p>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-2 text-gray-600">
                                    <span x-text="formatDate(c.fecha_inicio_periodo)"></span>
                                    <span>→</span>
                                    <span x-text="formatDate(c.fecha_fin_periodo)"></span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <span class="px-3 py-1 rounded-full text-xs font-bold"
                                      :class="{
                                          'bg-yellow-100 text-yellow-700': c.estado === 'Enviada',
                                          'bg-green-100 text-green-700': c.estado === 'Pagada',
                                          'bg-red-100 text-red-700': c.estado === 'Rechazada'
                                      }"
                                      x-text="c.estado"></span>
                            </td>
                            <td class="px-6 py-4 text-right font-mono font-bold text-gray-700">
                                <span x-text="formatearDinero(c.total_numeros)"></span>
                            </td>
                            <td class="px-6 py-4 text-center flex justify-center gap-2">
                                <button @click="verDetalle(c)" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg tooltip" title="Ver Detalle">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                </button>
                                <button @click="descargarPDF(c)" class="p-2 text-red-600 hover:bg-red-50 rounded-lg tooltip" title="Descargar PDF">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                </button>
                            </td>
                        </tr>
                    </template>
                    
                    <tr x-show="cuentas.length === 0">
                        <td colspan="5" class="py-10 text-center text-gray-400">
                            No se encontraron registros.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div x-show="modal.open" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm" style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl p-6 flex flex-col max-h-[80vh]">
            
            <div class="flex justify-between items-start mb-4 pb-4 border-b border-gray-100">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Detalle Cuenta de Cobro #<span x-text="modal.data?.id"></span></h3>
                    <p class="text-sm text-gray-500">Desglose de actividades reportadas.</p>
                </div>
                <button @click="modal.open = false" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-xs text-gray-500 uppercase">
                        <tr>
                            <th class="p-3">Cliente / Módulo</th>
                            <th class="p-3">Caso</th>
                            <th class="p-3 text-right">Cantidad</th>
                            <th class="p-3 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <template x-for="d in modal.detalles" :key="d.id">
                            <tr>
                                <td class="p-3">
                                    <p class="font-bold text-gray-800" x-text="d.cliente"></p>
                                    <p class="text-xs text-gray-500" x-text="d.modulo"></p>
                                </td>
                                <td class="p-3 text-gray-600" x-text="d.nro_caso_int_ext || '---'"></td>
                                <td class="p-3 text-right">
                                    <span x-text="d.cantidad_dias_reportados > 0 ? d.cantidad_dias_reportados + ' Días' : d.horas_reportadas + ' Hrs'"></span>
                                </td>
                                <td class="p-3 text-right font-mono font-bold text-gray-700" x-text="formatearDinero(d.total_cobrar)"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="mt-4 pt-4 border-t border-gray-100 flex justify-end">
                <button @click="modal.open = false" class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 font-bold">Cerrar</button>
            </div>

        </div>
    </div>

</div>
