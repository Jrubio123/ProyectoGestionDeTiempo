<div x-data="solicitudesCoordApp()" class="rrhh-page max-w-7xl mx-auto space-y-6">
    <section class="relative overflow-hidden bg-white/40 backdrop-blur-xl border-b border-white/20 p-8 rounded-b-3xl shadow-sm">
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl"></div>

        <div class="relative flex items-start justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Gestión de Talento</h1>
                <p class="text-slate-600 mt-1 text-sm font-medium">
                    Solicitudes de personal para RRHH con seguimiento claro por prioridad y estado.
                </p>
            </div>
            <button @click="resetForm(); modalNueva = true"
                    class="bg-indigo-600/90 hover:bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-200 transition-all active:scale-95">
                + Nueva Solicitud
            </button>
        </div>
    </section>

    <section class="px-4 pb-8">
        <div class="bg-white/30 backdrop-blur-md border border-white/20 rounded-3xl shadow-sm overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50/50 text-slate-500 font-bold uppercase tracking-wide text-xs border-b border-slate-100">
                    <tr>
                        <th class="p-4">Fecha</th>
                        <th class="p-4">Cliente / Proyecto</th>
                        <th class="p-4">Perfil Solicitado</th>
                        <th class="p-4">Prioridad</th>
                        <th class="p-4 text-center">Estado (RRHH)</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-slate-700">
                    <template x-for="s in misSolicitudes" :key="s.id">
                        <tr class="hover:bg-white/40 transition-colors">
                            <td class="p-4" x-text="formatDate(s.created_at)"></td>
                            <td class="p-4">
                                <p class="font-bold text-slate-800" x-text="s.cliente"></p>
                                <p class="text-xs text-slate-500" x-text="s.modulo"></p>
                            </td>
                            <td class="p-4" x-text="s.perfil"></td>
                            <td class="p-4">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold"
                                    :class="{
                                        'bg-red-100 text-red-600': s.prioridad === 'Alta',
                                        'bg-amber-100 text-amber-600': s.prioridad === 'Media',
                                        'bg-blue-100 text-blue-600': s.prioridad === 'Baja'
                                    }" x-text="s.prioridad"></span>
                            </td>
                            <td class="p-4 text-center">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold"
                                    :class="{
                                        'bg-orange-100 text-orange-600': s.estado === 'Pendiente',
                                        'bg-green-100 text-green-600': ['Reclutamiento','Entrevistas','Contratado'].includes(s.estado),
                                        'bg-slate-100 text-slate-500': s.estado === 'Cancelado'
                                    }"
                                    x-text="s.estado">
                                </span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </section>

    <div x-show="modalNueva" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="fixed inset-0 z-50 flex items-start justify-center bg-slate-900/20 backdrop-blur-sm px-3 pt-16 pb-4">
        
        <div class="bg-white/80 backdrop-blur-2xl border border-white/40 w-full max-w-3xl max-h-[88vh] overflow-y-auto no-scrollbar p-8 rounded-[2.5rem] shadow-2xl">
            <div class="flex items-start justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Requerir Nuevo Consultor</h2>
                    <p class="text-sm text-slate-500 mt-1">Completa la solicitud para enviarla al flujo de Talento Humano.</p>
                </div>
                <button type="button" @click="modalNueva = false; resetForm()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form @submit.prevent="enviarSolicitud" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <select x-model="form.cliente_id" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        <option value="">Selecciona Cliente...</option>
                        <template x-for="c in clientes" :key="c.id"><option :value="c.id" x-text="c.titulo"></option></template>
                    </select>

                    <select x-model="form.modulo_id" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        <option value="">Tecnología / Módulo...</option>
                        <template x-for="m in modulos" :key="m.id"><option :value="m.id" x-text="m.titulo"></option></template>
                        <option value="__otros__">Otros</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" x-model="form.perfil"
                        :placeholder="form.modulo_id === '__otros__' ? 'Especifica el perfil requerido *' : 'Perfil (Ej: ABAP)'"
                        :class="form.modulo_id === '__otros__' ? 'ring-2 ring-indigo-400/40 border-indigo-300' : ''"
                        class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                    <select x-model="form.nivel" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        <option value="Junior">Junior</option>
                        <option value="Semi-senior">Semi-senior</option>
                        <option value="Senior">Senior</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" x-model="form.tiempo" placeholder="Tiempo estimado (Ej: 6 meses)" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                    <select x-model="form.modalidad" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        <option value="Full time">Full time</option>
                        <option value="Medio tiempo">Medio tiempo</option>
                        <option value="Por horas">Por horas</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <select x-model="form.ubicacion" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        <option value="Remoto">Remoto</option>
                        <option value="Híbrido">Híbrido</option>
                        <option value="En sitio">En sitio</option>
                    </select>
                    <input type="date" x-model="form.fecha_inicio_esperada" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <select x-model="form.tipo_proyecto" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        <option value="">Tipo de proyecto (opcional)</option>
                        <option value="Soporte">Soporte</option>
                        <option value="Roll out">Roll out</option>
                        <option value="Implementación">Implementación</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                        <option value="Migración">Migración</option>
                    </select>
                    <select x-model="form.prioridad" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">Desde&nbsp;&dollar;</span>
                        <input type="number" min="0" x-model="form.presupuesto_min" placeholder="0" class="w-full bg-white/50 border border-slate-200 rounded-2xl pl-14 pr-3 py-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">Hasta&nbsp;&dollar;</span>
                        <input type="number" min="0" x-model="form.presupuesto_max" placeholder="0" class="w-full bg-white/50 border border-slate-200 rounded-2xl pl-14 pr-3 py-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                    </div>
                </div>

                <textarea x-model="form.experiencia" rows="3" placeholder="Experiencia requerida" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"></textarea>
                <textarea x-model="form.descripcion" rows="4" placeholder="Descripción de la solicitud" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"></textarea>
                <textarea x-model="form.informacion_adicional" rows="3" placeholder="Información adicional (opcional)" class="w-full bg-white/50 border border-slate-200 rounded-2xl p-3 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"></textarea>

                <div x-show="touched && !formValido" class="rounded-2xl border border-amber-200 bg-amber-50/80 p-3 text-xs text-amber-700">
                    <span class="font-semibold">Campos faltantes:</span>
                    <span x-text="camposFaltantes.join(', ')"></span>
                </div>

                <div class="mt-8 flex justify-end gap-3">
                    <button type="button" @click="modalNueva = false; resetForm()" class="px-6 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-all">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 text-white px-8 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all">Enviar a RRHH</button>
                </div>
            </form>
        </div>
    </div>
</div>
