<div x-data="solicitudesReclApp()" class="max-w-7xl mx-auto space-y-6">

    <div class="bg-purple-900 text-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">Pool de Selección</h1>
            <p class="text-purple-200 text-sm">Gestiona las vacantes activas</p>
        </div>
        <div class="flex gap-2">
            <button @click="filtro = 'Todos'" class="px-3 py-1 rounded bg-purple-800 text-xs hover:bg-purple-700">Todos</button>
            <button @click="filtro = 'Pendiente'" class="px-3 py-1 rounded bg-red-500 text-xs font-bold">Pendientes</button>
            <button @click="filtro = 'Entrevistas'" class="px-3 py-1 rounded bg-yellow-500 text-xs font-bold text-black">Entrevistas</button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="s in solicitudesFiltradas" :key="s.id">
            <div class="bg-white rounded-lg shadow border-l-4 p-4 relative cursor-pointer" @click="abrirDetalle(s)"
                 :class="{
                    'border-red-500': s.estado === 'Pendiente',
                    'border-yellow-500': s.estado === 'Reclutamiento' || s.estado === 'Entrevistas',
                    'border-green-500': s.estado === 'Contratado'
                 }">
                
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-gray-800" x-text="s.perfil"></h3>
                    <span class="text-[10px] uppercase font-bold tracking-wide" x-text="s.prioridad"></span>
                </div>
                
                <p class="text-sm text-gray-600 mb-1"><span class="font-bold">Cliente:</span> <span x-text="s.cliente"></span></p>
                <p class="text-sm text-gray-600 mb-3"><span class="font-bold">Solicita:</span> <span x-text="s.solicitante"></span></p>

                <div class="mt-4 pt-3 border-t border-gray-100" @click.stop>
                    <label class="text-xs text-gray-900 block mb-1">Estado Actual:</label>
                    <select @change="cambiarEstado(s.id, $event.target.value)" 
                            class="w-full text-sm border-gray-200 rounded bg-gray-50 focus:ring-purple-500">
                        <option value="Pendiente" :selected="s.estado == 'Pendiente'">Pendiente</option>
                        <option value="Reclutamiento" :selected="s.estado == 'Reclutamiento'">Reclutamiento</option>
                        <option value="Entrevistas" :selected="s.estado == 'Entrevistas'">Entrevistas</option>
                        <option value="Contratado" :selected="s.estado == 'Contratado'">Contratado</option>
                        <option value="Cancelado" :selected="s.estado == 'Cancelado'">Cancelado</option>
                    </select>
                </div>

                <button @click.stop="abrirNotas(s)" class="mt-3 w-full text-center text-xs text-purple-600 hover:underline">
                    Ver descripción / Agregar Notas
                </button>
            </div>
        </template>
    </div>

    <div x-show="modalDetalle" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[80vh] overflow-y-auto p-6 md:p-8 transform transition-all duration-300"
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
    >
        <div class="flex items-start justify-between gap-4 mb-4">
            <div>
                <h3 class="font-bold text-lg">Detalle de Solicitud</h3>
                <p class="text-xs text-gray-900">Perfil: <span class="font-semibold" x-text="itemActivo.perfil"></span></p>
            </div>
            <button @click="modalDetalle = false" class="text-gray-900 hover:text-gray-600">Cerrar</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Cliente</p>
                <p class="font-semibold" x-text="itemActivo.cliente || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Módulo</p>
                <p class="font-semibold" x-text="itemActivo.modulo || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Solicita</p>
                <p class="font-semibold" x-text="itemActivo.solicitante || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Nivel</p>
                <p class="font-semibold" x-text="itemActivo.nivel || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Tiempo</p>
                <p class="font-semibold" x-text="itemActivo.tiempo || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Ubicación</p>
                <p class="font-semibold" x-text="itemActivo.ubicacion || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Modalidad</p>
                <p class="font-semibold" x-text="itemActivo.modalidad || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Inicio esperado</p>
                <p class="font-semibold" x-text="itemActivo.fecha_inicio_esperada || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Tipo de proyecto</p>
                <p class="font-semibold" x-text="itemActivo.tipo_proyecto || '-' "></p>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-xs text-gray-900">Presupuesto</p>
                <p class="font-semibold" x-text="itemActivo.presupuesto || '-' "></p>
            </div>
        </div>

        <div class="mt-5 space-y-3">
            <div>
                <p class="text-xs text-gray-900 mb-1">Experiencia requerida</p>
                <p class="text-sm text-gray-700 bg-gray-50 p-3 rounded" x-text="itemActivo.experiencia || '-' "></p>
            </div>
            <div>
                <p class="text-xs text-gray-900 mb-1">Descripción</p>
                <p class="text-sm text-gray-700 bg-gray-50 p-3 rounded" x-text="itemActivo.descripcion || '-' "></p>
            </div>
            <div>
                <p class="text-xs text-gray-900 mb-1">Información adicional</p>
                <p class="text-sm text-gray-700 bg-gray-50 p-3 rounded" x-text="itemActivo.informacion_adicional || '-' "></p>
            </div>
        </div>
    </div>
</div>

<div x-show="modalNotas" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6">
        <h3 class="font-bold text-lg mb-2">Notas de Seguimiento</h3>
        <p class="text-sm text-gray-900 mb-4 bg-gray-50 p-2 rounded" x-text="itemActivo.descripcion"></p>
        
        <textarea x-model="itemActivo.observaciones_rrhh" rows="5" 
                  class="w-full border rounded p-3 text-sm focus:ring-purple-500" 
                  placeholder="Escribe aquí el avance del proceso (ej: Candidato X enviado a técnica...)"></textarea>
        
        <div class="mt-4 flex justify-end">
            <button @click="guardarNotas" class="bg-purple-600 text-white px-4 py-2 rounded shadow">Guardar Notas</button>
        </div>
    </div>
</div>

</div>
