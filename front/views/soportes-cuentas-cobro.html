<div x-data="soportesCuentasCobroApp()" x-init="init()" class="max-w-7xl mx-auto space-y-6 animate-fade-in-up">
    <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-sm border border-cyan-50">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-blue-600">
            Soportes de Cuentas de Cobro
        </h1>
        <p class="text-gray-500 text-sm mt-1">Vista de consulta para Administrador y Coordinador.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex flex-wrap gap-4 items-end">
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase">Consultor</label>
                <select x-model="filtros.consultor_id" class="block w-72 p-2 border rounded-lg text-sm">
                    <option value="">Todos</option>
                    <template x-for="c in consultores" :key="c.id">
                        <option :value="c.id" x-text="c.nombre"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 uppercase">Aprobado por</label>
                <select x-model="filtros.coordinador_id" class="block w-72 p-2 border rounded-lg text-sm">
                    <option value="">Todos</option>
                    <template x-for="a in aprobadores" :key="a.id">
                        <option :value="a.id" x-text="`${a.nombre} (${a.rol})`"></option>
                    </template>
                </select>
            </div>

            <button @click="cargarSoportes" class="px-4 py-2 bg-cyan-600 text-white rounded-lg font-bold shadow hover:bg-cyan-700 transition-colors">
                Filtrar
            </button>
            <button @click="limpiarFiltros" class="px-4 py-2 text-gray-500 hover:text-gray-700 font-medium">
                Limpiar
            </button>
        </div>

        <div class="overflow-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 sticky top-0 z-10 text-xs font-bold text-gray-400 uppercase">
                    <tr>
                        <th class="px-6 py-4">Cuenta</th>
                        <th class="px-6 py-4">Consultor</th>
                        <th class="px-6 py-4">Periodo</th>
                        <th class="px-6 py-4 text-right">Total</th>
                        <th class="px-6 py-4 text-center">Soportes</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50 text-sm">
                    <template x-for="item in soportes" :key="item.id">
                        <tr class="hover:bg-cyan-50/20 transition-colors">
                            <td class="px-6 py-4">
                                <p class="font-bold text-gray-800">#<span x-text="cuentaCorta(item.id)"></span></p>
                                <p class="text-xs text-gray-400" x-text="formatDate(item.created_at)"></p>
                            </td>
                            <td class="px-6 py-4">
                                <p class="font-medium text-gray-700" x-text="item.consultor_nombre || 'N/A'"></p>
                                <p class="text-xs text-gray-400" x-text="item.consultor_email || ''"></p>
                                <p class="text-xs text-cyan-700 mt-1">
                                    Aprobado por: <span class="font-semibold" x-text="item.coordinador_nombre || 'N/A'"></span>
                                </p>
                            </td>
                            <td class="px-6 py-4 text-gray-600">
                                <span x-text="formatDate(item.fecha_inicio_periodo)"></span>
                                <span> → </span>
                                <span x-text="formatDate(item.fecha_fin_periodo)"></span>
                            </td>
                            <td class="px-6 py-4 text-right font-mono font-bold text-gray-700" x-text="formatearDinero(item.total_numeros)"></td>
                            <td class="px-6 py-4 text-center">
                                <button x-show="getDocumentosDeItem(item).length"
                                        @click="verDocumentos(item)"
                                        class="px-3 py-1.5 rounded-lg bg-cyan-600 text-white text-xs font-bold hover:bg-cyan-700">
                                    Ver documentos
                                </button>
                                <span x-show="!getDocumentosDeItem(item).length" class="text-xs text-gray-400">Sin documentos</span>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="!loading && soportes.length === 0">
                        <td colspan="5" class="py-10 text-center text-gray-400">No se encontraron soportes.</td>
                    </tr>
                    <tr x-show="loading">
                        <td colspan="5" class="py-10 text-center text-gray-400">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modalDocumentos"
         x-show="modalDocsOpen"
         x-cloak
         x-transition.opacity
         @keydown.escape.window="cerrarModalDocs()"
         style="margin-top: 0;"
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl border border-gray-100 max-h-[85vh] flex flex-col"
             @click.outside="cerrarModalDocs()">
            <div class="flex items-center justify-between p-5 border-b border-gray-100">
                <div>
                    <h2 class="text-xl font-extrabold text-gray-800">Documentos subidos</h2>
                    <p class="text-xs text-gray-500 mt-0.5">Cuenta #<span x-text="docsCuentaId"></span></p>
                </div>
                <button @click="cerrarModalDocs()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
            </div>

            <div class="p-5 overflow-auto space-y-2">
                <template x-for="(doc, idx) in docsActuales" :key="doc.url || idx">
                    <div class="flex items-center justify-between gap-3 rounded-xl border border-gray-200 px-4 py-3">
                        <div class="min-w-0">
                            <p class="truncate text-sm font-semibold text-gray-700" x-text="doc.nombre || `Documento ${idx + 1}`"></p>
                            <p x-show="doc.principal" class="text-xs font-semibold text-emerald-600">Cuenta firmada</p>
                        </div>
                        <button @click="window.open(doc.url, '_blank', 'noopener,noreferrer')" :disabled="!doc.url"
                                class="px-3 py-1.5 text-sm font-semibold text-cyan-700 hover:bg-cyan-50 rounded-lg disabled:opacity-50">
                            Ver
                        </button>
                    </div>
                </template>
                <p x-show="!docsActuales.length" class="py-8 text-center text-gray-400 text-sm">No hay documentos para esta cuenta.</p>
            </div>

            <div class="p-4 border-t border-gray-100 flex justify-end">
                <button @click="cerrarModalDocs()"
                        class="px-4 py-2 text-gray-500 hover:text-gray-700 font-medium">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
