<div x-data="tarifasApp()" class="max-w-7xl mx-auto space-y-6 animate-fade-in-up">

    <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-sm border border-indigo-50 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">
                Tarifas de Consultores
            </h1>
            <p class="text-gray-500 text-sm mt-1">Gestiona los costos por asignación, módulo y cliente.</p>
        </div>
        <div class="hidden md:flex items-center gap-2 px-4 py-2 bg-indigo-50 rounded-lg text-indigo-700 font-bold text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Control Financiero</span>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <div class="lg:col-span-4">
            <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 sticky top-6">
                
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-1.5 h-6 bg-indigo-600 rounded-full"></span>
                        <span x-text="form.id ? 'Editar Tarifa' : 'Nueva Tarifa'"></span>
                    </h2>
                    <button @click="limpiarFormulario" class="text-xs text-gray-400 hover:text-indigo-600 transition-colors">Limpiar</button>
                </div>

                <form @submit.prevent="guardarTarifa" class="space-y-5">

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Cliente <span class="text-red-500">*</span></label>
                        <input type="text"
                               x-model="form.cliente_id"
                               list="clientesFormList"
                               placeholder="Seleccione..."
                               @change="validarDuplicado"
                               class="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all">
                        <datalist id="clientesFormList">
                            <template x-for="c in cat.clientes" :key="c.id">
                                <option :value="c.id" x-text="c.titulo"></option>
                            </template>
                        </datalist>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Consultor <span class="text-red-500">*</span></label>
                        <input type="text"
                               x-model="form.consultor_id"
                               list="consultoresFormList"
                               placeholder="Seleccione..."
                               @change="cambiarMoneda(); validarDuplicado()"
                               class="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all">
                        <datalist id="consultoresFormList">
                            <template x-for="c in cat.consultores" :key="c.id">
                                <option :value="c.id" x-text="c.nombre"></option>
                            </template>
                        </datalist>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Módulo</label>
                            <input type="text"
                                   x-model="form.modulo_id"
                                   list="modulosFormList"
                                   placeholder="Seleccione"
                                   @change="validarDuplicado"
                                   class="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-indigo-500">
                            <datalist id="modulosFormList">
                                <template x-for="m in cat.modulos" :key="m.id">
                                    <option :value="m.id" x-text="m.titulo"></option>
                                </template>
                            </datalist>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Tipo</label>
                            <input type="text"
                                   x-model="form.tipo_asignacion_id"
                                   list="tiposFormList"
                                   placeholder="Seleccione..."
                                   @change="validarDuplicado"
                                   class="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-indigo-500">
                            <datalist id="tiposFormList">
                                <template x-for="t in cat.tipos" :key="t.id">
                                    <option :value="t.id" x-text="t.titulo"></option>
                                </template>
                            </datalist>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1 ml-1">
                            <label class="block text-xs font-bold text-gray-500 uppercase" x-text="esFullTime ? 'Tarifa Mensual' : 'Tarifa Hora'"></label>
                            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" x-text="monedaSymbol"></span>
                        </div>
                        <input type="number" 
                               x-model="form.valor" 
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-700 font-mono text-lg focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all text-right"
                               placeholder="0.00">
                    </div>

                    <div x-show="errors.duplicado" x-transition class="bg-red-50 text-red-600 p-3 rounded-lg text-xs font-bold flex items-center gap-2 border border-red-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span>¡Consultor ya tiene tarifa creada para esta combinación!</span>
                    </div>

                    <div class="pt-2">
                        <button type="submit" 
                            :disabled="!formValido || errors.duplicado"
                            class="w-full py-3.5 text-white transition-all duration-300 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl font-bold shadow-lg hover:shadow-indigo-500/30 hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex justify-center items-center gap-2">
                            <span x-show="!form.id">Guardar Tarifa</span>
                            <span x-show="form.id">Actualizar</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="bg-white rounded-2xl shadow-lg border border-gray-100 flex flex-col h-full min-h-[500px]">
                
                <div class="p-5 border-b border-gray-100 bg-gray-50/50 flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <label class="text-xs font-bold text-gray-400 uppercase">Filtrar Cliente</label>
                        <input type="text"
                               x-model="filters.cliente"
                               list="clientesList"
                               placeholder="Todos"
                               class="w-full mt-1 p-2 border border-gray-200 rounded-lg text-sm bg-white focus:border-indigo-500 outline-none">
                        <datalist id="clientesList">
                            <template x-for="c in cat.clientes" :key="c.id">
                                <option :value="c.titulo" x-text="c.titulo"></option>
                            </template>
                        </datalist>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs font-bold text-gray-400 uppercase">Filtrar Consultor</label>
                        <input type="text"
                               x-model="filters.consultor"
                               list="consultoresList"
                               placeholder="Todos"
                               class="w-full mt-1 p-2 border border-gray-200 rounded-lg text-sm bg-white focus:border-indigo-500 outline-none">
                        <datalist id="consultoresList">
                            <template x-for="c in cat.consultores" :key="c.id">
                                <option :value="c.nombre" x-text="c.nombre"></option>
                            </template>
                        </datalist>
                    </div>
                    <div class="flex items-end">
                        <button @click="cargarDatos" class="p-2.5 bg-white border border-gray-200 rounded-lg text-gray-500 hover:text-indigo-600 hover:border-indigo-300 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-xs font-bold text-gray-400 uppercase bg-white border-b border-gray-100">
                                <th class="px-6 py-4">Consultor / Cliente</th>
                                <th class="px-6 py-4">Asignación</th>
                                <th class="px-6 py-4">Módulo</th>
                                <th class="px-6 py-4 text-right">Tarifa</th>
                                <th class="px-6 py-4 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50">
                            <template x-for="t in tarifasFiltradas" :key="t.id">
                                <tr class="hover:bg-indigo-50/40 transition-colors group" :class="{'bg-indigo-50': form.id === t.id}">
                                    
                                    <td class="px-6 py-4">
                                        <p class="font-bold text-gray-800" x-text="t.nombre_consultor"></p>
                                        <p class="text-xs text-gray-500 flex items-center gap-1 mt-1">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                            <span x-text="t.nombre_cliente"></span>
                                        </p>
                                    </td>

                                    <td class="px-6 py-4">
                                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full"
                                              :class="t.tipo_asignacion === 'Full time' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'" 
                                              x-text="t.tipo_asignacion">
                                        </span>
                                    </td>

                                    <td class="px-6 py-4 text-sm text-gray-600" x-text="t.nombre_modulo"></td>

                                    <td class="px-6 py-4 text-right font-mono font-bold text-gray-700">
                                        <span x-text="t.moneda === 'Dólar' ? 'USD' : '$'"></span>
                                        <span x-text="formatearDinero(t.valor)"></span>
                                    </td>

                                    <td class="px-6 py-4 text-center">
                                        <div class="flex justify-center gap-2 opacity-60 group-hover:opacity-100 transition-opacity">
                                            <button @click="editar(t)" class="p-1.5 text-blue-600 hover:bg-blue-100 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                            <button @click="eliminar(t.id)" class="p-1.5 text-red-600 hover:bg-red-100 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
